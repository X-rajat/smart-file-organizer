<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- Messy files on the left -->
  <g opacity="0.9">
    <rect x="70"  y="70"  width="46" height="58" rx="6" fill="#f87171" transform="rotate(-14 93 99)"/>
    <rect x="125" y="140" width="46" height="58" rx="6" fill="#fbbf24" transform="rotate(10 148 169)"/>
    <rect x="60"  y="170" width="46" height="58" rx="6" fill="#34d399" transform="rotate(-6 83 199)"/>
    <rect x="150" y="60"  width="46" height="58" rx="6" fill="#60a5fa" transform="rotate(18 173 89)"/>
    <rect x="205" y="120" width="46" height="58" rx="6" fill="#c084fc" transform="rotate(-20 228 149)"/>
  </g>

  <!-- Arrow -->
  <path d="M275 150 H345" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <path d="M335 138 L352 150 L335 162" fill="none" stroke="#a78bfa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tidy folders -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">
    <g transform="translate(380 70)">
      <path d="M0 10 h28 l8 8 h44 v52 h-80 z" fill="#f87171"/><text x="40" y="92">Documents</text>
    </g>
    <g transform="translate(480 70)">
      <path d="M0 10 h28 l8 8 h44 v52 h-80 z" fill="#60a5fa"/><text x="40" y="92">Images</text>
    </g>
    <g transform="translate(380 175)">
      <path d="M0 10 h28 l8 8 h44 v52 h-80 z" fill="#fbbf24"/><text x="40" y="92">Videos</text>
    </g>
    <g transform="translate(480 175)">
      <path d="M0 10 h28 l8 8 h44 v52 h-80 z" fill="#34d399"/><text x="40" y="92">Audio</text>
    </g>
  </g>

  <!-- Title -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="620" y="135" font-size="52" font-weight="700" fill="#f8fafc">Smart File Organizer</text>
    <rect x="622" y="152" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="620" y="195" font-size="22" fill="#cbd5e1">One double-click. Every file in its place.</text>
    <text x="620" y="232" font-size="16" fill="#94a3b8">Pure Windows batch  ·  No install  ·  Preview &amp; Undo</text>
  </g>
</svg>
